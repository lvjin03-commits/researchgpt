name: DOCX smoke

on:
  pull_request:
    paths:
      - "app/api/chat/**"
      - "lib/document-v2/**"
      - "lib/export/**"
      - "scripts/verify-document-v2-docx.cjs"
      - "scripts/verify-word-visuals.cjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "app/api/chat/**"
      - "lib/document-v2/**"
      - "lib/export/**"
      - "scripts/verify-document-v2-docx.cjs"
      - "scripts/verify-word-visuals.cjs"
      - "package.json"
      - "package-lock.json"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:document-v2-docx
      - run: npm run test:word-visuals
