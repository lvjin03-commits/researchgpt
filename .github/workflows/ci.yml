name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:grant:ci

  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run test:point-ledger
      - run: npm run test:ai-operation-contracts
      - run: npm run test:point-billing-engine
      - run: npm run test:ai-billing-integration
      - run: npm run test:point-payment-contracts
      - run: npm run test:payment-risk-controls
      - run: npm run test:billing-canary
      - run: npm run test:account-statements
      - run: npm run test:account-orders-resume
      - run: npm run test:account-security
      - run: npm run check:document-architecture
      - run: npm run test:document-contracts
      - run: npm run test:document-v2-templates
      - run: npm run test:document-v2-generation
      - run: npm run test:document-v2-orchestrator
      - run: npm run test:document-v2-runtime
      - run: npm run typecheck
      - run: npm run build
